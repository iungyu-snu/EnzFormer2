[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enzformer2-temp"
version = "0.2.0"
description = "EnzFormer2-Temp sequence-only ESMC adapters for protein thermostability prediction."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "EnzFormer2_temp contributors" }]
license = { text = "MIT" }

dependencies = [
    "torch",
    "esm",
    "datasets==3.6.0",
    "transformers==4.48.1",
    "httpx>=0.27",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "tqdm",
    "rich",
]

[project.scripts]
enzformer2-temp = "ddg_lora.cli:main"

[project.optional-dependencies]
viz = ["matplotlib", "scienceplots"]
dev = ["ruff", "pyarrow", "openpyxl", "biopython", "build"]
external = ["biopython", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ddg_lora*"]
exclude = ["legacy*", "trash*", "new_prior*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "trash", "new_prior"]

[tool.ruff.lint]
# Keep the core error checks explicit across Ruff releases.
select = ["E4", "E7", "E9", "F"]
