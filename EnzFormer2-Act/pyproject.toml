[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enzformer2"
version = "0.1.0"
description = "Reproducible research workflows for EnzFormer2-Act"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "httpx>=0.27",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "torch>=2.1,<2.10",
  "esm==3.2.1.post1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[project.scripts]
enzformer2 = "enzformer2.cli:main"

[tool.setuptools]
include-package-data = false
packages = [
  "enzformer2",
  "enzformer2.act",
  "enzformer2.config",
  "enzformer2.data",
  "enzformer2.models",
  "enzformer2.profile",
  "enzformer2.utils",
  "benchmark",
  "benchmark.shared",
  "benchmark.shared.point_mutation",
]

[tool.setuptools.package-dir]
enzformer2 = "src"

[tool.setuptools.package-data]
"enzformer2.profile" = ["*.json", "*.md", "prompts/*.txt"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  "benchmark/**/*.csv",
  "artifacts",
  "legacy",
  "trash",
  "build",
  "dist",
  "*.egg-info",
  ".pytest_cache",
  ".ruff_cache",
]

[tool.ruff.lint]
# Keep the core error checks explicit across Ruff releases.
select = ["E4", "E7", "E9", "F"]
